<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Magnat Flower — склад, продажи, закупки, расходы и отчёты">
  <title>Magnat Flower — управление торговлей</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="auth-page" id="auth-page" hidden>
    <div class="auth-card">
      <div class="auth-logo">✿</div>
      <div class="eyebrow">MAGNAT FLOWER</div>
      <h1 id="auth-title">Вход в систему</h1>
      <p id="auth-description">Войдите, чтобы открыть общую базу магазина.</p>
      <form id="auth-form">
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <p class="form-error" id="auth-error" aria-live="polite"></p>
        <button class="primary" id="auth-submit">Войти</button>
      </form>
      <button class="text-button" id="auth-toggle" type="button">Создать аккаунт</button>
      <p class="setup-message" id="setup-message" hidden></p>
    </div>
  </section>

  <div id="app-shell" hidden>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Magnat Flower">
      <span class="brand-mark">✿</span><span>MAGNAT<small>FLOWER / УПРАВЛЕНИЕ ТОРГОВЛЕЙ</small></span>
    </a>
    <div class="account-bar"><span class="sync-dot" id="sync-dot"></span><span id="account-email"></span><button id="logout" type="button">Выйти</button></div>
  </header>

  <main>
    <section class="heading">
      <div><div class="eyebrow">РАБОЧЕЕ ПРОСТРАНСТВО</div><h1>Магазин под контролем</h1><p>Склад, букеты, расходы и результаты.</p></div>
      <button class="primary" data-action="sale">＋ Новая продажа</button>
    </section>

    <section class="stats" id="stats"></section>
    <div id="notice" aria-live="polite"></div>

    <nav class="tabs" aria-label="Разделы">
      <button class="active" data-tab="stock">▣ Склад</button>
      <button data-tab="recipes">✿ Букеты</button>
      <button data-tab="counterparties">♙ Контрагенты</button>
      <button data-tab="expenses">₽ Расходы</button>
      <button data-tab="history">▤ Операции</button>
      <button data-tab="reports">▥ Отчёты</button>
    </nav>

    <section id="content"></section>
    <footer><strong>Magnat Flower</strong><span>Кыргызский сом · Облачная база Supabase</span></footer>
  </main>

  <dialog id="modal"><div id="modal-content"></div></dialog>
  </div>
  <script src="app.js"></script>
</body>
</html>
